# Versión de escritorio: Windows (instalador + portable), macOS (.dmg) y Linux (AppImage).
# - En cada push a una rama que no sea main: solo arma, y deja los archivos para bajar en la ejecución de Actions.
# - Para publicar en GitHub Releases la versión de package.json, cualquiera de las dos:
#     · en GitHub: Actions → "Versión de escritorio" → Run workflow (en main) → marcar "publicar";
#     · subir un tag vX.Y.Z igual a la versión de package.json.
#   El instalador de Windows y el AppImage se actualizan solos desde ahí.
#   Primero se crea la versión como borrador y se publica cuando terminaron los tres sistemas
#   (al publicarla, GitHub crea el tag si no existía).
name: Versión de escritorio

on:
  push:
    branches-ignore: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar en GitHub Releases la versión de package.json
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  preparar:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Versión a publicar
        id: version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* && "$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "El tag $GITHUB_REF_NAME no coincide con la versión de package.json ($VERSION)."
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Crear la versión como borrador
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "La versión $TAG ya está publicada: subí la versión en package.json."
            exit 1
          fi
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "ORBE $TAG" \
            --notes "Windows: instalador (se actualiza solo) o portable. macOS: .dmg (sin firmar: la primera vez, clic derecho → Abrir). Linux: AppImage (se actualiza solo)."

  armar:
    needs: preparar
    # También corre cuando "preparar" se saltea (push a una rama, sin publicar).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # prebuild:electron copia el wasm de MediaPipe a public/mediapipe/wasm
      - run: npm run build:electron
      - name: Armar (y subir al borrador, si se publica)
        run: npx electron-builder --publish ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publicar) && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Sin certificado de firma: no se firma (en macOS hay que abrirla con clic derecho → Abrir la primera vez).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Dejar los archivos para bajar
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.publicar) }}
        uses: actions/upload-artifact@v4
        with:
          name: ORBE-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          retention-days: 14

  publicar:
    needs: [preparar, armar]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    runs-on: ubuntu-latest
    steps:
      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preparar.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
